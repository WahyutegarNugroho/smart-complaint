<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Smart Complaint</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #101010;
      color: #f2f2f2;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .container { text-align: center; max-width: 400px; }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; color: #9fe870; }
    p { font-size: 0.9rem; color: #888; line-height: 1.6; margin-bottom: 2rem; }
    .icon { font-size: 4rem; margin-bottom: 1.5rem; }
    .btn {
      display: inline-block;
      padding: 0.8rem 2rem;
      background: #9fe870;
      color: #0e0f0c;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>Koneksi Terputus</h1>
    <p>Anda sedang offline. Silakan periksa koneksi internet Anda dan coba lagi. Halaman yang telah dikunjungi sebelumnya mungkin masih tersedia.</p>
    <a href="/" class="btn">Coba Lagi</a>
  </div>
</body>
</html>
