name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level=high || true

      - name: Scan for secrets in git history
        run: |
          if git log --all --oneline --diff-filter=A -- '.env' 2>/dev/null | grep -q .; then
            echo "::error::SECURITY: .env file detected in git history! Run 'git filter-branch' to remove it."
            exit 1
          fi

      - run: pnpm prisma generate

      - run: pnpm tsc --noEmit

      - run: pnpm lint

      - run: pnpm test
